document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

* ---- MOBILE (par défaut) ---- */\n#device{\n  width:100%;min-height:100vh;\n  position:relative;overflow:hidden;background:var(--co);\n}\n\n.screen{\n  display:none;position:absolute;inset:0;\n  width:100%;height:100%;\n  overflow-y:auto;overflow-x:hidden;\n  scrollbar-width:none;-webkit-overflow-scrolling:touch;\n  flex-direction:column;\n}\n.screen::-webkit-scrollbar{display:none;}\n.screen.active{display:flex;animation:fadeIn .22s ease-out;}\nhtml.static-shot .screen.active{animation:none;}\n@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}\n\n/* ---- DESKTOP (≥900px) — app centrée, sans cadre ---- */\n@media(min-width:900px){\n\n  body{\n    min-height:100vh;\n    display:flex;align-items:stretch;justify-content:center;\n    background:#0a0704;\n  }\n\n  /* L'app s'affiche en colonne centrée, pleine hauteur, sans bordure ni encoche */\n  #device{\n    width:440px;max-width:100%;\n    height:100vh;min-height:100vh;\n    flex-shrink:0;\n    position:relative;overflow:hidden;\n    background:var(--co);\n    box-shadow:0 0 1px rgba(245,236,215,.12), 0 0 90px rgba(0,0,0,.55);\n  }\n\n  /* Les écrans gardent leur comportement mobile (absolus dans la colonne) */\n}\n\n/* Suppression statusbar (inutile hors frame) */\n#statusbar{display:none !important;}\n\n/* ============================================================\n   S1 — SPLASH\n============================================================ */\n#s1{background:var(--co);align-items:center;justify-content:space-between;}\n.splash-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 55% at 50% 60%,rgba(193,125,60,.22) 0%,transparent 70%);pointer-events:none;}\n.splash-zan{animation:zanFloat 3s ease-in-out infinite;position:relative;z-index:2;}\n@keyframes zanFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}\n\n/* ============================================================\n   SROLE — CHOIX DU PARCOURS\n============================================================ */\n#srole{background:var(--co);flex-direction:column;justify-content:center;padding:40px 24px max(40px,env(safe-area-inset-bottom));position:relative;}\n#srole::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 90% 50% at 50% 18%,rgba(193,125,60,.16) 0%,transparent 65%);pointer-events:none;}\n.role-wrap{position:relative;z-index:2;width:100%;max-width:420px;margin:0 auto;}\n.role-head{margin-bottom:30px;}\n.role-title{font-family:var(--fd);font-size:34px;line-height:.95;letter-spacing:-.01em;color:var(--cr);margin-bottom:12px;}\n.role-title em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--oc);}\n.role-sub{font-size:14px;color:rgba(245,236,215,.55);line-height:1.6;max-width:34ch;}\n.role-cards{display:flex;flex-direction:column;gap:12px;}\n.role-card{display:flex;align-items:center;gap:15px;text-align:left;width:100%;background:var(--co2);border:1.5px solid rgba(245,236,215,.08);border-radius:18px;padding:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .2s,transform .12s,background .2s;}\n.role-card:hover{border-color:rgba(193,125,60,.4);background:rgba(193,125,60,.06);}\n.role-card:active{transform:scale(.985);}\n.rc-ic{width:50px;height:50px;border-radius:14px;background:rgba(193,125,60,.14);border:1px solid rgba(193,125,60,.22);display:flex;align-items:center;justify-content:center;color:var(--oc);flex-shrink:0;}\n.rc-txt{flex:1;min-width:0;}\n.rc-name{font-family:var(--fd);font-size:17px;color:var(--cr);margin-bottom:4px;display:flex;align-items:center;gap:8px;}\n.rc-tag{font-family:var(--fm);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--oc);background:rgba(193,125,60,.16);border:1px solid rgba(193,125,60,.3);padding:3px 7px;border-radius:99px;}\n.rc-desc{font-size:12.5px;color:rgba(245,236,215,.5);line-height:1.5;}\n.rc-arr{color:rgba(245,236,215,.25);flex-shrink:0;}\n.role-card:hover .rc-arr{color:var(--oc);}\n.rc-tag{font-family:var(--fm);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#5BA873;background:rgba(91,168,115,.14);border:1px solid rgba(91,168,115,.3);padding:2px 6px;border-radius:99px;font-weight:400;}\n.role-card-c .rc-ic{background:rgba(91,168,115,.12);border-color:rgba(91,168,115,.22);color:#5BA873;}\n.role-card-c:hover{border-color:rgba(91,168,115,.4);background:rgba(91,168,115,.06);}\n.role-card-c:hover .rc-arr{color:#5BA873;}\n\n/* ============================================================\n   S2 — ONBOARDING\n============================================================ */\n#s2{background:var(--co);}\n.ob-viewport{flex:1;position:relative;overflow:hidden;}\n.ob-track{display:flex;width:300%;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1);}\n.ob-slide{\n  width:calc(100%/3);height:100%;\n  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;\n  padding:0 32px 28px;position:relative;\n}\n.ob-img{position:absolute;top:0;left:0;right:0;bottom:45%;display:flex;align-items:center;justify-content:center;}\n.ob-body{position:relative;z-index:2;text-align:center;width:100%;}\n.ob-chip{display:inline-block;font-family:var(--fm);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--oc);border:1px solid rgba(193,125,60,.4);padding:5px 12px;border-radius:99px;margin-bottom:12px;}\n.ob-body h2{font-family:var(--fd);font-size:32px;line-height:.95;letter-spacing:-.01em;color:var(--cr);margin-bottom:10px;}\n.ob-body p{font-size:14px;color:rgba(245,236,215,.6);line-height:1.6;max-width:28ch;margin:0 auto 20px;font-weight:300;}\n.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px;}\n.ob-dot{width:6px;height:6px;border-radius:3px;background:rgba(245,236,215,.2);transition:all .3s;}\n.ob-dot.on{width:24px;background:var(--oc);}\n.ob-footer{padding:0 24px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;}\n\n/* ============================================================\n   S3 — AUTH CHOICE (connexion ou inscription)\n============================================================ */\n#s3{background:var(--co);padding:0 24px max(40px,env(safe-area-inset-bottom));justify-content:flex-end;}\n.auth-zan{display:flex;justify-content:center;margin-bottom:0;flex:1;align-items:flex-end;}\n.auth-choice-title{font-family:var(--fd);font-size:30px;line-height:.95;color:var(--cr);margin-bottom:8px;}\n.auth-choice-title em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--oc);display:block;}\n.auth-choice-sub{font-size:14px;color:rgba(245,236,215,.5);line-height:1.6;margin-bottom:28px;}\n\n/* ============================================================\n   S4 — INSCRIPTION (nouveau compte)\n   S5 — CONNEXION (déjà un compte)\n============================================================ */\n#s4,#s5{background:var(--co);padding:56px 24px max(36px,env(safe-area-inset-bottom));}\n.back-btn{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:rgba(245,236,215,.5);cursor:pointer;margin-bottom:28px;border:none;background:none;padding:0;-webkit-tap-highlight-color:transparent;}\n.form-head{margin-bottom:28px;}\n.form-head h2{font-family:var(--fd);font-size:30px;line-height:.95;color:var(--cr);margin-bottom:8px;}\n.form-head p{font-size:14px;color:rgba(245,236,215,.55);line-height:1.6;}\n.field-label{font-family:var(--fm);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,236,215,.4);margin-bottom:7px;display:block;}\n.txt-input{width:100%;background:var(--co2);border:1.5px solid rgba(245,236,215,.12);border-radius:12px;padding:15px 16px;font-family:var(--fs);font-size:15px;color:var(--cr);outline:none;transition:border-color .2s;margin-bottom:14px;}\n.txt-input:focus{border-color:var(--oc);}\n.txt-input::placeholder{color:rgba(245,236,215,.3);}\n.phone-row{display:flex;gap:10px;margin-bottom:14px;}\n.flag-btn{display:flex;align-items:center;gap:6px;padding:0 14px;background:var(--co2);border:1.5px solid rgba(245,236,215,.12);border-radius:12px;font-family:var(--fm);font-size:13px;color:var(--cr);cursor:pointer;white-space:nowrap;flex-shrink:0;height:52px;border:1.5px solid rgba(245,236,215,.12);}\n.input-note{font-size:12px;color:rgba(245,236,215,.3);margin-bottom:28px;line-height:1.6;}\n.divider-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:rgba(245,236,215,.25);font-family:var(--fm);font-size:10px;letter-spacing:.18em;}\n.divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:rgba(245,236,215,.08);}\n.switch-link{text-align:center;font-size:13px;color:rgba(245,236,215,.45);margin-top:16px;}\n.switch-link span{color:var(--oc);cursor:pointer;text-decoration:underline;}\n\n/* ============================================================\n   S6 — OTP\n============================================================ */\n#s6{background:var(--co);padding:56px 24px max(36px,env(safe-area-inset-bottom));}\n.otp-grid{display:flex;gap:10px;margin:24px 0 12px;}\n.otp-box{flex:1;height:58px;background:var(--co2);border:1.5px solid rgba(245,236,215,.12);border-radius:12px;font-family:var(--fd);font-size:26px;color:var(--cr);text-align:center;outline:none;transition:border-color .2s;}\n.otp-box:focus{border-color:var(--oc);}\n.otp-box.filled{border-color:rgba(193,125,60,.5);}\n.otp-resend{font-size:13px;color:rgba(245,236,215,.4);text-align:center;margin-bottom:28px;}\n.otp-resend span{color:var(--oc);cursor:pointer;text-decoration:underline;}\n\n/* Auth — email + mot de passe (US-008/009/010) */\n.auth-scroll{flex:1;overflow-y:auto;scrollbar-width:none;}\n.auth-scroll::-webkit-scrollbar{display:none;}\n.field-2col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}\n.field-2col .txt-input{width:100%;}\n.field-label .opt{color:rgba(245,236,215,.3);text-transform:none;letter-spacing:0;font-size:10px;}\n.input-hint{font-size:11px;color:rgba(245,236,215,.42);margin:-7px 0 16px;}\n.pwd-wrap{position:relative;margin-bottom:6px;}\n.pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(245,236,215,.38);cursor:pointer;display:flex;padding:6px;-webkit-tap-highlight-color:transparent;}\n.pwd-eye.on{color:var(--oc);}\n.input-error{font-size:12.5px;color:#E0937F;background:rgba(200,57,43,.1);border:1px solid rgba(200,57,43,.28);border-radius:10px;padding:10px 12px;margin-bottom:6px;line-height:1.4;}\n.auth-toggle{display:flex;background:var(--co2);border:1px solid rgba(245,236,215,.08);border-radius:12px;padding:3px;margin-bottom:18px;}\n.at-btn{flex:1;padding:10px;border:none;background:none;border-radius:9px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,236,215,.45);cursor:pointer;transition:all .18s;-webkit-tap-highlight-color:transparent;}\n.at-btn.on{background:var(--oc);color:var(--co);}\n.forgot-link{align-self:flex-start;background:none;border:none;color:var(--oc);font-family:var(--fs);font-size:13px;cursor:pointer;padding:2px 0;margin-bottom:6px;-webkit-tap-highlight-color:transparent;}\n.auth-confirm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px;}\n.confirm-ic{width:74px;height:74px;border-radius:50%;background:rgba(193,125,60,.12);border:1px solid rgba(193,125,60,.28);display:flex;align-items:center;justify-content:center;color:var(--oc);margin-bottom:20px;}\n.confirm-h{font-family:var(--fd);font-size:26px;color:var(--cr);margin-bottom:10px;}\n.confirm-p{font-size:14px;color:rgba(245,236,215,.6);line-height:1.6;max-width:32ch;margin-bottom:18px;}\n.confirm-p strong{color:var(--cr);font-weight:600;}\n.confirm-note{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;letter-spacing:.05em;color:rgba(245,236,215,.5);background:var(--co2);border:1px solid rgba(245,236,215,.07);padding:9px 14px;border-radius:99px;}\n\n/* ============================================================\n   S7 — ACCUEIL\n============================================================ */\n#s7{background:var(--co);flex-direction:column;}\n.home-top{padding:52px 20px 0;flex-shrink:0;}\n.home-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}\n.logo-pill{display:flex;align-items:center;gap:8px;}\n.logo-dot{width:7px;height:7px;border-radius:50%;background:var(--oc);}\n.avatar{width:34px;height:34px;border-radius:50%;background:rgba(193,125,60,.15);border:1.5px solid rgba(193,125,60,.35);display:flex;align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;color:var(--oc);cursor:pointer;}\n.greet{font-family:var(--fi);font-style:italic;font-size:26px;line-height:1.2;color:var(--cr);margin-bottom:3px;}\n.greet strong{font-family:var(--fd);font-style:normal;color:var(--oc);}\n.greet-sub{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,236,215,.35);margin-bottom:16px;}\n.search-bar{display:flex;align-items:center;gap:10px;background:var(--co2);border:1.5px solid rgba(245,236,215,.08);border-radius:12px;padding:12px 16px;margin-bottom:14px;}\n.search-bar input{background:none;border:none;outline:none;font-family:var(--fs);font-size:14px;color:var(--cr);flex:1;}\n.search-bar input::placeholder{color:rgba(245,236,215,.3);}\n.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}\n.chips::-webkit-scrollbar{display:none;}\n.chip{flex-shrink:0;font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:all .15s;border:none;-webkit-tap-highlight-color:transparent;}\n.chip.on{background:var(--oc);color:var(--onac);}\n.chip.off{background:rgba(245,236,215,.06);border:1px solid rgba(245,236,215,.12);color:rgba(245,236,215,.55);}\n.home-scroll{flex:1;overflow-y:auto;padding:14px 20px 90px;scrollbar-width:none;}\n.home-scroll::-webkit-scrollbar{display:none;}\n.sec-label{font-family:var(--fm);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:rgba(245,236,215,.4);margin-bottom:12px;margin-top:20px;}\n.sec-label:first-child{margin-top:0;}\n.ev-card{background:var(--co2);border-radius:16px;overflow:hidden;margin-bottom:12px;cursor:pointer;border:1px solid rgba(245,236,215,.05);transition:transform .15s;-webkit-tap-highlight-color:transparent;}\n.ev-card:active{transform:scale(.98);}\n.ev-img{height:160px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--stage);}\n.ev-badge{position:absolute;top:12px;left:12px;font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;background:var(--oc);color:var(--co);padding:5px 10px;border-radius:99px;}\n.ev-body{padding:14px 16px 16px;}\n.ev-date{font-family:var(--fm);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--oc);margin-bottom:5px;}\n.ev-title{font-family:var(--fd);font-size:17px;line-height:1.05;color:var(--cr);margin-bottom:8px;}\n.ev-foot{display:flex;justify-content:space-between;align-items:center;}\n.ev-loc{font-size:12px;color:rgba(245,236,215,.45);display:flex;align-items:center;gap:4px;}\n.ev-price{font-family:var(--fd);font-size:14px;color:var(--oc);}\n.ev-row{display:flex;background:var(--co2);border-radius:14px;overflow:hidden;margin-bottom:10px;cursor:pointer;border:1px solid rgba(245,236,215,.05);transition:transform .15s;-webkit-tap-highlight-color:transparent;}\n.ev-row:active{transform:scale(.98);}\n.ev-row-img{width:78px;flex-shrink:0;background:var(--stage);display:flex;align-items:center;justify-content:center;}\n.ev-row-body{padding:12px 14px;flex:1;min-width:0;}\n.ev-row-date{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--oc);margin-bottom:4px;}\n.ev-row-title{font-family:var(--fd);font-size:14px;line-height:1.1;color:var(--cr);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.ev-row-price{font-family:var(--fm);font-size:11px;color:rgba(245,236,215,.45);}\n.ev-row-price span{color:var(--oc);}\n.ev-row-arr{display:flex;align-items:center;padding-right:14px;color:rgba(245,236,215,.2);flex-shrink:0;}\n\n/* ============================================================\n   BOTTOM NAV (S7, S8 profil, etc.)\n============================================================ */\n.bnav{position:absolute;bottom:0;left:0;right:0;background:rgba(26,18,8,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(245,236,215,.07);display:flex;justify-content:space-around;padding:10px 0 max(14px,env(safe-area-inset-bottom));z-index:100;}\n.bn-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 16px;border:none;background:none;-webkit-tap-highlight-color:transparent;}\n.bn-ico{color:rgba(245,236,215,.3);display:flex;align-items:center;}\n.bn-lbl{font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,236,215,.3);}\n.bn-item.on .bn-ico,.bn-item.on .bn-lbl{color:var(--oc);}\n\n/* ============================================================\n   S8 — EXPLORER\n============================================================ */\n#s8{background:var(--co);flex-direction:column;}\n.explore-top{padding:52px 20px 16px;flex-shrink:0;}\n.explore-top h1{font-family:var(--fd);font-size:28px;color:var(--cr);margin-bottom:16px;}\n.explore-scroll{flex:1;overflow-y:auto;padding:0 20px 90px;scrollbar-width:none;}\n.explore-scroll::-webkit-scrollbar{display:none;}\n\n/* Catégories Explorer — icônes monoline, accent chaud par catégorie */\n.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}\n.cat-card{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:16px;padding:16px;cursor:pointer;text-align: ============================================================\n   S12 — PAIEMENT\n============================================================ */\n#s12{background:var(--co);padding:56px 20px max(28px,env(safe-area-inset-bottom));overflow-y:auto;}\n.pay-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}\n.pay-item{background:var(--co2);border:1.5px solid rgba(245,236,215,.08);border-radius:14px;padding:15px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:border-color .2s;-webkit-tap-highlight-color:transparent;}\n.pay-item.sel{border-color:var(--oc);background:rgba(193,125,60,.07);}\n.pay-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;}\n.pay-name{font-family:var(--fd);font-size:14px;color:var(--cr);margin-bottom:2px;}\n.pay-sub{font-size:12px;color:rgba(245,236,215,.4);}\n.pay-check{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(245,236,215,.2);flex-shrink:0;position:relative;}\n.pay-item.sel .pay-check{background:var(--oc);border-color:var(--oc);}\n.pay-item.sel .pay-check::after{content:'';position:absolute;top:4px;left:6px;width:6px;height:9px;border-right:2.5px solid var(--co);border-bottom:2.5px solid var(--co);transform:rotate(40deg);}\n.sec-note{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(245,236,215,.4);margin:12px 0;padding:12px 14px;background:rgba(245,236,215,.03);border-radius:10px;border:1px solid rgba(245,236,215,.07);}\n.pay-total{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid rgba(245,236,215,.07);margin-bottom:16px;}\n\n/* ============================================================\n   S13 — TRAITEMENT\n============================================================ */\n#s13{background:var(--pp);align-items:center;justify-content:center;}\n.proc-zan{position:relative;margin-bottom:44px;}\n.proc-ring{position:absolute;inset:-22px;border-radius:50%;border:2px solid transparent;border-top-color:var(--oc);animation:spin 1.2s linear infinite;}\n.proc-ring2{position:absolute;inset:-38px;border-radius:50%;border:1.5px solid transparent;border-top-color:rgba(193,125,60,.25);animation:spin 2s linear infinite reverse;}\n@keyframes spin{to{transform:rotate(360deg);}}\n\n/* ============================================================\n   S14 — CONFIRMATION\n============================================================ */\n#s14{background:var(--co);align-items:center;justify-content:center;text-align:center;overflow-y:auto;}\n.conf-bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 60%,rgba(193,125,60,.18) 0%,transparent 70%);pointer-events:none;}\n.conf-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%;padding:52px 24px max(36px,env(safe-area-inset-bottom));}\n.conf-chip{display:inline-block;font-family:var(--fm);font-size:9px;letter-spacing:.22em;text-transform:uppercase;background:rgba(193,125,60,.14);color:var(--oc);border:1px solid rgba(193,125,60,.3);padding:6px 14px;border-radius:99px;margin-bottom:14px;}\n.conf-title{font-family:var(--fd);font-size:32px;line-height:.95;color:var(--cr);margin-bottom:8px;}\n.conf-title em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--oc);display:block;}\n.conf-sub{font-size:14px;color:rgba(245,236,215,.6);line-height:1.65;max-width:26ch;margin-bottom:22px;}\n.conf-info{background:var(--co2);border-radius:14px;padding:14px 18px;width:100%;margin-bottom:22px;text-align:left;}\n.ci-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid rgba(245,236,215,.06);}\n.ci-row:last-child{border-bottom:none;}\n.ci-k{color:rgba(245,236,215,.45);}\n.ci-v{font-family:var(--fm);font-size:12px;color:var(--cr);}\n\n/* ============================================================\n   S15 — MES BILLETS\n============================================================ */\n#s15{background:var(--co);flex-direction:column;}\n.billets-top{padding:52px 20px 12px;flex-shrink:0;}\n.billets-top h1{font-family:var(--fd);font-size:28px;color:var(--cr);margin-bottom:4px;}\n.billets-top .sub{font-family:var(--fi);font-style:italic;font-size:17px;color:rgba(245,236,215,.45);}\n.tabs{display:flex;margin:12px 20px 0;background:var(--co2);border-radius:10px;padding:3px;flex-shrink:0;}\n.tab-btn{flex:1;padding:9px;text-align:center;font-family:var(--fm);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,236,215,.4);border-radius:8px;cursor:pointer;transition:all .2s;border:none;background:none;-webkit-tap-highlight-color:transparent;}\n.tab-btn.on{background:var(--oc);color:var(--co);}\n.blist{flex:1;overflow-y:auto;padding:12px 20px 90px;scrollbar-width:none;}\n.blist::-webkit-scrollbar{display:none;}\n.billet-row{background:var(--co2);border-radius:14px;overflow:hidden;margin-bottom:10px;display:flex;cursor:pointer;border:1px solid rgba(245,236,215,.05);transition:transform .15s;-webkit-tap-highlight-color:transparent;}\n.billet-row:active{transform:scale(.98);}\n.br-stripe{width:5px;background:var(--oc);flex-shrink:0;}\n.billet-row.past .br-stripe{background:rgba(245,236,215,.12);}\n.br-body{padding:13px 13px 13px 15px;flex:1;min-width:0;}\n.br-date{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--oc);margin-bottom:4px;}\n.billet-row.past .br-date{color:rgba(245,236,215,.35);}\n.br-title{font-family:var(--fd);font-size:15px;color:var(--cr);margin-bottom:6px;line-height:1.1;}\n.billet-row.past .br-title{color:rgba(245,236,215,.45);}\n.br-foot{display:flex;justify-content:space-between;align-items:center;}\n.br-type{font-family:var(--fm);font-size:10px;letter-spacing:.1em;color:rgba(245,236,215,.35);}\n.br-status{font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;border-radius:99px;}\n.br-status.live{background:rgba(193,125,60,.14);color:var(--oc);}\n.br-status.done{background:rgba(245,236,215,.07);color:rgba(245,236,215,.3);}\n.br-arr{display:flex;align-items:center;padding-right:13px;color:rgba(245,236,215,.2);flex-shrink:0;}\n\n/* ============================================================\n   S16 — BILLET QR\n============================================================ */\n#s16{background:var(--co);overflow-y:auto;padding:52px 20px 40px;}\n.ticket-card{border-radius:20px;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.55);}\n.t-top{background:var(--oc);padding:22px 20px 18px;position:relative;min-height:106px;}\n.t-eyebrow{font-family:var(--fm);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(26,18,8,.5);margin-bottom:6px;}\n.t-name{font-family:var(--fd);font-size:22px;line-height:1;color:var(--co);margin-bottom:3px;}\n.t-sub{font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:rgba(26,18,8,.6);}\n.t-zan-dec{position:absolute;right:14px;bottom:0;}\n.t-sep{background:var(--cr2);position:relative;height:20px;display:flex;align-items:center;}\n.t-sep::before{content:'';position:absolute;left:-11px;width:22px;height:22px;border-radius:50%;background:var(--co);}\n.t-sep::after{content:'';position:absolute;right:-11px;width:22px;height:22px;border-radius:50%;background:var(--co);}\n.t-dash{flex:1;border-top:2px dashed rgba(26,18,8,.18);margin:0 14px;}\n.t-mid{background:var(--cr2);padding:16px 20px 18px;}\n.t-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}\n.t-field .tf-l{font-family:var(--fm);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(26,18,8,.4);margin-bottom:3px;}\n.t-field .tf-v{font-family:var(--fd);font-size:13px;color:var(--co);line-height:1.1;}\n.qr-area{display:flex;flex-direction:column;align-items:center;gap:8px;}\n.qr-lbl{font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(26,18,8,.4);}\n.t-bot{background:var(--co);padding:13px 20px;display:flex;justify-content:space-between;align-items:center;}\n.t-bot-brand{font-family:var(--fm);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,236,215,.4);}\n.t-bot-brand span{color:var(--oc);}\n.t-offline{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,236,215,.3);}\n.offline-dot{width:6px;height:6px;border-radius:50%;background:#4CAF50;box-shadow:0 0 6px #4CAF50;}\n.ref-tag{margin-top:14px;text-align:center;font-family:var(--fm);font-size:12px;letter-spacing:.16em;color:rgba(245,236,215,.35);background:var(--co2);border-radius:8px;padding:10px;}\n\n/* Billet QR — finition premium */\n.ticket-card{box-shadow:0 22px 60px -14px rgba(0,0,0,.6),0 10px 28px -10px rgba(193,125,60,.28);}\n.t-top{overflow:hidden;}\n.qr-hint{display:flex;align-items:center;gap:5px;font-family:var(--fm);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(26,18,8,.4);margin-top:3px;}\n@media(prefers-reduced-motion:no-preference){\n  .t-top::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 32%,rgba(255,250,240,.34) 47%,rgba(255,250,240,.06) 53%,transparent 68%);transform:translateX(-130%);animation:tHolo 5s ease-in-out infinite;pointer-events:none;}\n  @keyframes tHolo{0%,62%{transform:translateX(-130%);}86%,100%{transform:translateX(130%);}}\n  .offline-dot{animation:dotPulse 2.2s ease-in-out infinite;}\n  @keyframes dotPulse{0%,100%{box-shadow:0 0 6px #4CAF50;opacity:.9;}50%{box-shadow:0 0 13px #4CAF50,0 0 4px #4CAF50;opacity:1;}}\n}\n\n/* Billet — code dynamique (remplace le QR) */\n.code-area{display:flex;flex-direction:column;align-items:center;}\n.code-ring{position:relative;width:142px;height:142px;margin-top:2px;}\n.ring-svg{width:142px;height:142px;transform:rotate(-90deg);}\n.ring-bg{fill:none;stroke:rgba(26,18,8,.12);stroke-width:5;}\n.ring-fg{fill:none;stroke:var(--oc);stroke-width:5;stroke-linecap:round;stroke-dasharray:339.29;stroke-dashoffset:0;}\n.code-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}\n.code-val{font-family:var(--fd);font-size:29px;letter-spacing:.04em;color:var(--co);line-height:1;transition:opacity .28s ease;}\n.code-unit{font-family:var(--fm);font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:rgba(26,18,8,.42);}\n.code-lbl{font-family:var(--fm);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(26,18,8,.42);margin-top:13px;text-align:center;}\n.barcode{width:100%;max-width:232px;height:48px;margin-top:13px;border-radius:5px;background:repeating-linear-gradient(90deg,#1A1208 0 3px,transparent 3px 5px,#1A1208 5px 6px,transparent 6px 9px,#1A1208 9px 12px,transparent 12px 13px,#1A1208 13px 16px,transparent 16px 20px);}\n.barcode.past{max-width:200px;height:42px;filter:grayscale(1);opacity:.22;background:repeating-linear-gradient(90deg,rgba(245,236,215,.6) 0 3px,transparent 3px 5px,rgba(245,236,215,.6) 5px 6px,transparent 6px 9px,rgba(245,236,215,.6) 9px 12px,transparent 12px 13px,rgba(245,236,215,.6) 13px 16px,transparent 16px 20px);}\n.barcode-ref{font-family:var(--fm);font-size:10px;letter-spacing:.26em;color:rgba(26,18,8,.5);text-align:center;margin-top:9px;}\n@media(prefers-reduced-motion:no-preference){\n  .ring-fg{animation:ringCount 10s linear infinite;}\n  @keyframes ringCount{from{stroke-dashoffset:0;}to{stroke-dashoffset:339.29;}}\n}\n\n/* ============================================================\n   S17 — BILLET PASSÉ\n============================================================ */\n#s17{background:var(--co);overflow-y:auto;padding:52px 20px 40px;}\n.past-stamp{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-16deg);font-family:var(--fd);font-size:26px;color:rgba(200,57,43,.55);border:3px solid rgba(200,57,43,.4);border-radius:8px;padding:4px 14px;letter-spacing:.1em;white-space:nowrap;pointer-events:none;}\n\n/* ============================================================\n   BOUTONS GLOBAUX\n============================================================ */\n.btn-p{display:block;width:100%;background:var(--oc);color:var(--onac);font-family:var(--fd);font-size:13px;text-transform:uppercase;letter-spacing:.04em;padding:16px 20px;border-radius:12px;border:none;cursor:pointer;text-align:center;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;user-select:none;}\n.btn-p:active{transform:scale(.97);background:#aa6c33;}\n.btn-s{display:block;width:100%;background:rgba(245,236,215,.06);color:rgba(245,236,215,.65);font-family:var(--fs);font-size:14px;font-weight:400;padding:15px 20px;border-radius:12px;border:1.5px solid rgba(245,236,215,.14);cursor:pointer;text-align:center;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent;}\n.btn-s:active{transform:scale(.97);}\n\n/* Zones photo (image-slot) — thématisées Wamiton */\nimage-slot{color:rgba(245,236,215,.4)!important;}\nimage-slot::part(frame){background:rgba(245,236,215,.04);}\nimage-slot::part(ring){border-color:rgba(245,236,215,.16);}\n\n/* Desktop — grille d'événements 2 colonnes */\n/* Desktop — ajustements dans le cadre */\n@media(min-width:900px){\n  .auth-zan svg{width:160px;}\n}\n\n/* ============================================================\n   ESPACE ORGANISATEUR\n============================================================ */\n/* En-têtes & conteneurs génériques orga */\n.o-top{padding:52px 20px 14px;flex-shrink:0;}\n.o-eyebrow{font-family:var(--fm);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--oc);margin-bottom:8px;}\n.o-h1{font-family:var(--fd);font-size:27px;line-height:1;color:var(--cr);}\n.o-h1 em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--oc);}\n.o-sub{font-family:var(--fi);font-style:italic;font-size:16px;color:rgba(245,236,215,.45);margin-top:5px;}\n.o-scroll{flex:1;overflow-y:auto;padding:14px 20px 96px;scrollbar-width:none;}\n.o-scroll::-webkit-scrollbar{display:none;}\n.o-screen{background:var(--co);flex-direction:column;}\n\n/* Onboarding orga (OONB) */\n#oonb{background:var(--co);padding:54px 24px max(28px,env(safe-area-inset-bottom));overflow-y:auto;}\n.oo-zan{display:flex;justify-content:center;margin-bottom:8px;}\n.oo-head h2{font-family:var(--fd);font-size:28px;line-height:.98;color:var(--cr);margin-bottom:10px;}\n.oo-head h2 em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--oc);}\n.oo-head p{font-size:14px;color:rgba(245,236,215,.55);line-height:1.6;margin-bottom:22px;max-width:34ch;}\n.oo-perks{display:flex;flex-direction:column;gap:9px;margin-bottom:22px;}\n.oo-perk{display:flex;align-items:center;gap:12px;background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:13px;padding:13px 14px;}\n.oo-perk-ic{width:38px;height:38px;border-radius:10px;background:rgba(193,125,60,.12);border:1px solid rgba(193,125,60,.2);display:flex;align-items:center;justify-content:center;color:var(--oc);flex-shrink:0;}\n.oo-perk-t{font-family:var(--fs);font-weight:600;font-size:13.5px;color:var(--cr);}\n.oo-perk-s{font-size:12px;color:rgba(245,236,215,.45);margin-top:2px;line-height:1.4;}\n\n/* Carte de statut (badge) — utilisée dashboard + détail */\n.st-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border-radius:99px;white-space:nowrap;}\n.st-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}\n.st-pub{color:#5FB878;background:rgba(95,184,120,.12);border:1px solid rgba(95,184,120,.28);}\n.st-wait{color:#D9A23C;background:rgba(217,162,60,.12);border:1px solid rgba(217,162,60,.28);}\n.st-past{color:rgba(245,236,215,.4);background:rgba(245,236,215,.06);border:1px solid rgba(245,236,215,.12);}\n.st-draft{color:rgba(245,236,215,.5);background:transparent;border:1px dashed rgba(245,236,215,.22);}\n.st-draft::before{background:transparent;border:1.5px solid currentColor;}\n\n/* Dashboard — barre filtre statut */\n.od-filter{display:flex;gap:8px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none;flex-shrink:0;}\n.od-filter::-webkit-scrollbar{display:none;}\n\n/* Carte événement orga */\n.oe-card{background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:16px;padding:15px 16px;margin-bottom:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .2s,transform .12s;}\n.oe-card:active{transform:scale(.985);}\n.oe-card:hover{border-color:rgba(193,125,60,.3);}\n.oe-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px;}\n.oe-date{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--oc);margin-bottom:5px;}\n.oe-title{font-family:var(--fd);font-size:17px;line-height:1.05;color:var(--cr);margin-bottom:3px;}\n.oe-venue{font-size:12px;color:rgba(245,236,215,.45);display:flex;align-items:center;gap:5px;}\n.oe-kpi{display:flex;align-items:stretch;gap:10px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(245,236,215,.06);}\n.oe-kc{flex:1;min-width:0;}\n.oe-kn{font-family:var(--fd);font-size:16px;color:var(--cr);line-height:1;margin-bottom:4px;}\n.oe-kn .u{font-family:var(--fm);font-size:10px;color:rgba(245,236,215,.4);font-weight:400;letter-spacing:.04em;}\n.oe-kl{font-family:var(--fm);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(245,236,215,.4);}\n.oe-kdiv{width:1px;background:rgba(245,236,215,.07);}\n.oe-bar{height:5px;border-radius:3px;background:rgba(245,236,215,.08);overflow:hidden;margin-top:11px;}\n.oe-bar > i{display:block;height:100%;background:var(--oc);border-radius:3px;}\n.oe-card.draft{opacity:.92;}\n.oe-card.draft .oe-title{color:rgba(245,236,215,.7);}\n.oe-resume{display:flex;align-items:center;gap:7px;margin-top:12px;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--oc);}\n\n/* Bouton flottant créer (FAB) */\n.o-fab{position:absolute;right:18px;bottom:90px;z-index:90;display:flex;align-items:center;gap:8px;background:var(--oc);color:var(--onac);border:none;font-family:var(--fd);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:14px 18px;border-radius:99px;cursor:pointer;box-shadow:0 10px 26px -8px rgba(193,125,60,.6);-webkit-tap-highlight-color:transparent;transition:transform .12s;}\n.o-fab:active{transform:scale(.95);}\n\n/* Détail événement orga (OEVENT) */\n.oev-head{padding:52px 20px 16px;flex-shrink:0;}\n.oev-back{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:rgba(245,236,215,.5);cursor:pointer;margin-bottom:18px;border:none;background:none;padding:0;-webkit-tap-highlight-color:transparent;}\n.oev-name{font-family:var(--fd);font-size:24px;line-height:1;color:var(--cr);margin:10px 0 8px;}\n.oev-meta{font-size:13px;color:rgba(245,236,215,.55);line-height:1.6;}\n.oev-meta b{color:var(--oc);font-weight:400;font-family:var(--fm);font-size:11px;letter-spacing:.06em;}\n.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}\n.kpi-cell{background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:14px;padding:15px 16px;}\n.kpi-cell.wide{grid-column:1 / -1;}\n.kpi-n{font-family:var(--fd);font-size:24px;color:var(--cr);line-height:1;margin-bottom:6px;}\n.kpi-n .u{font-family:var(--fm);font-size:12px;color:rgba(245,236,215,.4);font-weight:400;}\n.kpi-n.acc{color:var(--oc);}\n.kpi-l{font-family:var(--fm);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,236,215,.42);}\n.kpi-sub{font-size:11.5px;color:rgba(245,236,215,.45);margin-top:6px;}\n\n/* Récap dates clés */\n.dates-card{background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:14px;padding:6px 16px;margin-bottom:14px;}\n.dk-row{display:flex;align-items:center;gap:12px a(181,80,42,.35);color:var(--oc);}\n.o-home{width:34px;height:34px;border-radius:50%;background:rgba(245,236,215,.06);border:1.5px solid rgba(245,236,215,.14);display:flex;align-items:center;justify-content:center;color:rgba(245,236,215,.7);cursor:pointer;-webkit-tap-highlight-color:transparent;flex-shrink:0;transition:border-color .18s,color .18s;}\n.o-home:active{transform:scale(.94);}\n.o-home:hover{border-color:rgba(181,80,42,.5);color:var(--oc);}\n#oprofile .prof2-av{background:linear-gradient(150deg,rgba(181,80,42,.32),rgba(181,80,42,.1));border-color:rgba(181,80,42,.42);color:var(--oc);}\n#oprofile .prof2-verif{background:var(--oc);}\n#oprofile .prof2-member{color:var(--oc);background:rgba(181,80,42,.12);border-color:rgba(181,80,42,.28);}\n#oprofile .p2-ic{background:rgba(181,80,42,.1);border-color:rgba(181,80,42,.18);}\n/* marqueur console persistant */\n.oconsole{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--oc);background:rgba(181,80,42,.16);border:1px solid rgba(181,80,42,.34);padding:4px 9px;border-radius:99px;vertical-align:middle;margin-left:9px;}\n.oconsole::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--oc);}\n\n/* ============================================================\n   SURFACE C — CONTRÔLE DES ENTRÉES (Check-in) — thème « Terrain »\n   Accent vert validation (GO) sur la surface la plus profonde.\n   Brand-safe : le vert #5BA873 sert déjà de couleur de validation.\n============================================================ */\n#conb,#cauth,#csync,#cscan,#cstats,#cteam{\n  --oc:#5BA873;           /* accent → vert terrain (GO) */\n  --onac:#0b0a06;         /* texte sur accent → presque noir */\n  --co:#0d0b06;           /* surface terrain, la plus profonde */\n  --co2:#16130c;          /* carte surélevée */\n  --stage:#0a0805;        /* viseur caméra */\n  --rd:#D2453A;           /* refus / stop */\n}\n.c-screen{background:var(--co);flex-direction:column;}\n.cterrain{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--oc);background:rgba(91,168,115,.16);border:1px solid rgba(91,168,115,.3);padding:3px 9px;border-radius:99px;white-space:nowrap;}\n.cterrain::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--oc);box-shadow:0 0 0 3px rgba(91,168,115,.18);}\n@media(prefers-reduced-motion:no-preference){.cterrain::before{animation:dotPulse 2s ease-in-out infinite;}}\n.bnav-c{background:rgba(13,11,6,.96);}\n.bnav-c .bn-item.on .bn-ico,.bnav-c .bn-item.on .bn-lbl{color:var(--oc);}\n\n/* CONB — accès agent */\n#conb .oo-perk-ic{background:rgba(91,168,115,.12);border-color:rgba(91,168,115,.22);color:var(--oc);}\n#conb{background:var(--co);padding:54px 24px max(28px,env(safe-area-inset-bottom));overflow-y:auto;}\n.conb-badge{display:flex;justify-content:center;margin-bottom:18px;}\n.conb-glyph{width:70px;height:70px;border-radius:20px;background:rgba(91,168,115,.12);border:1px solid rgba(91,168,115,.25);display:flex;align-items:center;justify-content:center;color:var(--oc);}\n.cev-pick{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}\n.cev-opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;background:var(--co2);border:1.5px solid rgba(245,236,215,.07);border-radius:15px;padding:14px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .18s,background .18s;}\n.cev-opt.sel{border-color:rgba(91,168,115,.5);background:rgba(91,168,115,.07);}\n.cev-radio{width:20px;height:20px;border-radius:50%;border:2px solid rgba(245,236,215,.2);flex-shrink:0;position:relative;transition:border-color .18s;}\n.cev-opt.sel .cev-radio{border-color:var(--oc);}\n.cev-opt.sel .cev-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--oc);}\n.cev-tx{flex:1;min-width:0;}\n.cev-name{font-family:var(--fd);font color:var(--oc);}\n\n/* CSCAN — scanner */\n#cscan{background:var(--stage);flex-direction:column;position:relative;padding-bottom:62px;}\n.scan-top{position:absolute;top:0;left:0;right:0;z-index:6;padding:50px 18px 14px;background:linear-gradient(180deg,rgba(10,8,5,.92),rgba(10,8,5,.55) 70%,transparent);}\n.scan-evrow{display:flex;align-items:center;justify-content:space-between;gap:12px;}\n.scan-evname{font-family:var(--fd);font-size:15px;color:var(--cr);line-height:1.05;}\n.scan-evsub{font-family:var(--fm);font-size:9.5px;letter-spacing:.08em;color:rgba(245,236,215,.5);margin-top:3px;}\n.scan-quit{width:36px;height:36px;border-radius:50%;background:rgba(245,236,215,.08);border:1px solid rgba(245,236,215,.12);display:flex;align-items:center;justify-content:center;color:rgba(245,236,215,.7);cursor:pointer;flex-shrink:0;}\n.sync-pill{display:inline-flex;align-items:center;gap:7px;margin-top:13px;font-family:var(--fm);font-size:9.5px;letter-spacing:.04em;color:var(--oc);background:rgba(91,168,115,.14);border:1px solid rgba(91,168,115,.28);padding:6px 11px;border-radius:99px;cursor:pointer;white-space:nowrap;max-width:100%;}\n.sync-pill .sp-dot{width:6px;height:6px;border-radius:50%;background:var(--oc);}\n.sync-pill.warn{color:#E8B04E;background:rgba(217,162,60,.13);border-color:rgba(217,162,60,.3);}\n.sync-pill.warn .sp-dot{background:#E8B04E;}\n.scan-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 80% 60% at 50% 42%,#13100a 0%,#0a0805 78%);overflow:hidden;}\n.scan-stage::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(245,236,215,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(245,236,215,.03) 1px,transparent 1px);background-size:34px 34px;mask:radial-gradient(circle at 50% 42%,#000 30%,transparent 72%);-webkit-mask:radial-gradient(circle at 50% 42%,#000 30%,transparent 72%);}\n.scan-frame{position:relative;width:230px;height:230px;}\n.scan-corner{position:absolute;width:38px;height:38px;border:3px solid var(--oc);}\n.scan-corner.tl{top:0;left:0;border-right:none;border-bottom:none;border-radius:14px 0 0 0;}\n.scan-corner.tr{top:0;right:0;border-left:none;border-bottom:none;border-radius:0 14px 0 0;}\n.scan-corner.bl{bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 14px;}\n.scan-corner.br{bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 14px 0;}\n.scan-laser{position:absolute;left:8px;right:8px;height:2px;top:8px;background:linear-gradient(90deg,transparent,var(--oc),transparent);box-shadow:0 0 12px 1px rgba(91,168,115,.7);border-radius:2px;}\n@media(prefers-reduced-motion:no-preference){#cscan[data-deck-active] .scan-laser,.screen.active .scan-laser{animation:laserScan 2.4s ease-in-out infinite;}}\n@keyframes laserScan{0%{top:8px;}50%{top:218px;}100%{top:8px;}}\n.scan-glyph{position:absolute;color:rgba(245,236,215,.13);}\n.scan-hint{position:absolute;bottom:118px;left:0;right:0;text-align:center;font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,236,215,.4);}\n.scan-bottom{flex-shrink:0;z-index:6;padding:16px 18px 14px;background:linear-gradient(0deg,rgba(10,8,5,.98),rgba(10,8,5,.86));border-top:1px solid rgba(245,236,215,.05);}\n.scan-count{display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:rgba(245,236,215,.6);margin-bottom:14px;}\n.scan-count b{font-family:var(--fd);color:var(--cr);font-size:14px;}\n.sim-label{text-align:center;font-family:var(--fm);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(245,236,215,.3);margin-bottom:9px;}\n.sim-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}\n.sim-btn{font-family:var(--fm);font-size:10.5px;letter-spacing:.04em;padding:11px 6px;border-radius:11px;border:1px solid;cursor:pointer;-webkit-tap-highlight-color:transparent;background:rgba(245,236,215,.04);transition:transform .1s;}\n.sim-btn:active{transform:scale(.96);}\n.sim-btn.ok{color:var(--oc);border-color:rgba(91,168,115,.4);}\n.sim-btn.used,.sim-btn.bad{color:#E88;border-color:rgba(210,69,58,.42);}\n\n/* Résultat de scan (plein écran, par-dessus le viseur) */\n.scan-result{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;}\n.scan-result.show{display:flex;animation:srPop .26s cubic-bezier(.2,.8,.3,1.2);}\n@keyframes srPop{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}\n.scan-result.valid{background:radial-gradient(ellipse 90% 70% at 50% 38%,#1d3b27 0%,#0c1a11 80%);}\n.scan-result.refus{background:radial-gradient(ellipse 90% 70% at 50% 38%,#3b1d1a 0%,#1a0d0b 80%);}\n.sr-mark{width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:22px;}\n.scan-result.valid .sr-mark{background:rgba(91,168,115,.16);border:2px solid var(--oc);color:var(--oc);box-shadow:0 0 0 14px rgba(91,168,115,.07);}\n.scan-result.refus .sr-mark{background:rgba(210,69,58,.16);border:2px solid var(--rd);color:#ED7A70;box-shadow:0 0 0 14px rgba(210,69,58,.07);}\n.sr-status{font-family:var(--fd);font-size:27px;line-height:1;margin-bottom:6px;}\n.scan-result.valid .sr-status{color:var(--oc);}\n.scan-result.refus .sr-status{color:#ED7A70;}\n.sr-reason{font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:rgba(245,236,215,.55);margin-bottom:24px;}\n.sr-card{width:100%;max-width:330px;background:rgba(245,236,215,.05);border:1px solid rgba(245,236,215,.12);border-radius:16px;padding:6px 18px;margin-bottom:26px;}\n.sr-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid rgba(245,236,215,.08);}\n.sr-row:last-child{border-bottom:none;}\n.sr-k{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,236,215,.45);}\n.sr-v{font-family:var(--fd);font-size:14px;color:var(--cr);text-align:right;}\n.sr-v.big{font-size:17px;}\n.sr-next{width:100%;max-width:330px;display:flex;align-items:center;justify-content:center;gap:9px;font-family:var(--fd);font-size:14px;padding:16px;border-radius:14px;border:none;cursor:pointer;background:var(--cr);color:#0b0a06;-webkit-tap-highlight-color:transparent;}\n.scan-result.show ~ .bnav{display:none;}\n\n/* CTEAM — agents */\n.cteam-counter{background:linear-gradient(160deg,rgba(91,168,115,.16),rgba(91,168,115,.04));border:1px solid rgba(91,168,115,.25);border-radius:16px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}\n.cc-num{font-family:var(--fd);font-size:34px;color:var(--cr);line-height:.9;}\n.cc-num .u{font-family:var(--fm);font-size:13px;color:rgba(245,236,215,.45);}\n.cc-tx .cc-l{font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(245,236,215,.5);margin-bottom:5px;}\n.cc-tx .cc-rate{font-size:12.5px;color:var(--oc);font-weight:600;}\n.agent-row{display:flex;align-items:center;gap:13px;background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:14px;padding:13px 15px;margin-bottom:10px;}\n.ag-av{width:42px;height:42px;border-radius:12px;background:rgba(91,168,115,.14);border:1px solid rgba(91,168,115,.26);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:14px;color:var(--oc);flex-shrink:0;}\n.ag-tx{flex:1;min-width:0;}\n.ag-name{font-family:var(--fd);font-size:14px;color:var(--cr);line-height:1.1;margin-bottom:3px;display:flex;align-items:center;gap:8px;}\n.ag-meta{font-family:var(--fm);font-size:10px;letter-spacing:.04em;color:rgba(245,236,215,.45);}\n.ag-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}\n.ag-dot.live{background:var(--oc);box-shadow:0 0 0 3px rgba(91,168,115,.18);}\n.ag-dot.off{background:rgba(245,236,215,.22);}\n.ag-scans{font-family:var(--fd);font-size:15px;color:var(--cr);text-align:right;line-height:1;}\n.ag-scans .u{font-family:var(--fm);font-size:9px;letter-spacing:.08em;color:rgba(245,236,215,.4);display:block;margin-top:4px;}\n.ag-add{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:rgba(91,168,115,.08);border:1.5px dashed rgba(91,168,115,.35);border-radius:14px;padding:15px;font-family:var(--fm);font-size:11px;letter-spacing:.06em;color:var(--oc);cursor:pointer;-webkit-tap-highlight-color:transparent;margin-top:4px;}\n\n/* CSTATS — historique de scans */\n.scan-log{display:flex;flex-direction:column;}\n.log-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(245,236,215,.06);}\n.log-row:last-child{border-bottom:none;}\n.log-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}\n.log-ic.ok{background:rgba(91,168,115,.14);color:var(--oc);}\n.log-ic.no{background:rgba(210,69,58,.14);color:#ED7A70;}\n.log-tx{flex:1;min-width:0;}\n.log-name{font-family:var(--fs);font-weight:600;font-size:13px;color:var(--cr);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n.log-sub{font-family:var(--fm);font-size:9.5px;letter-spacing:.04em;color:rgba(245,236,215,.42);margin-top:2px;}\n.log-time{font-family:var(--fm);font-size:11px;color:rgba(245,236,215,.5);flex-shrink:0;}\n.fill-big{display:flex;align-items:baseline;gap:6px;margin-bottom:12px;}\n.fill-big .fb-n{font-family:var(--fd);font-size:38px;color:var(--cr);line-height:.9;}\n.fill-big .fb-u{font-family:var(--fm);font-size:13px;color:rgba(245,236,215,.45);}\n\n/* ============================================================\n   ORGA — ONBOARDING / AUTH / TIERS / PLAFOND (IFU)\n============================================================ */\n/* Choix de niveau de compte (OTIER) */\n#ologin,#osignup{background:var(--co);padding:56px 24px max(34px,env(safe-area-inset-bottom));}\n#otier{background:var(--co);padding:54px 24px max(28px,env(safe-area-inset-bottom));overflow-y:auto;}\n.tier-head h2{font-family:var(--fd);font-size:26px;line-height:1;color:var(--cr);margin-bottom:10px;}\n.tier-head h2 em{font-family:var(--fi);font-style:italic;font-weight:400;color:var(--oc);}\n.tier-head p{font-size:13.5px;color:rgba(245,236,215,.55);line-height:1.6;margin-bottom:22px;max-width:36ch;}\n.tier-card{display:block;width:100%;text-align:left;background:var(--co2);border:1.5px solid rgba(245,236,215,.08);border-radius:18px;padding:18px;margin-bottom:13px;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .18s,background .18s,transform .12s;}\n.tier-card:active{transform:scale(.99);}\n.tier-card:hover{border-color:rgba(181,80,42,.4);}\n.tier-card.pro{border-color:rgba(181,80,42,.32);background:linear-gradient(165deg,rgba(181,80,42,.1),rgba(181,80,42,.02));}\n.tier-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;}\n.tier-lvl{font-family:var(--fm);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--oc);}\n.tier-badge{font-family:var(--fm);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;}\n.tier-badge.free{color:#9FC3CF;background:rgba(120,170,185,.14);border:1px solid rgba(120,170,185,.3);}\n.tier-badge.full{color:var(--onac);background:var(--oc);}\n.tier-name{font-family:var(--fd);font-size:19px;color:var(--cr);line-height:1.05;margin-bottom:12px;}\n.tier-feat{display:flex;flex-direction:column;gap:9px;}\n.tier-fr{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:rgba(245,236,215,.7);line-height:1.4;}\n.tier-fr svg{flex-shrink:0;margin-top:1px;}\n.tier-fr.req svg{color:rgba(245,236,215,.4);}\n.tier-fr.adv svg{color:var(--oc);}\n.tier-fr.lim svg{color:#D9A23C;}\n.tier-cap{margin-top:13px;padding-top:13px;border-top:1px solid rgba(245,236,215,.08);font-family:var(--fm);font-size:11px;color:rgba(245,236,215,.5);display:flex;align-items:center;justify-content:space-between;}\n.tier-cap b{color:var(--cr);font-weight:400;}\n.tier-cap .arr{color:var(--oc);}\n\n/* Champ document (CIP / IFU / RCCM) */\n.doc-field{margin-bottom:16px;}\n.doc-slot{width:100%;height:108px;border-radius:14px;overflow:hidden;display:block;--is-bg:var(--co2);}\n.doc-hint{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(245,236,215,.42);margin-top:7px;line-height:1.4;}\n.doc-hint svg{flex-shrink:0;color:var(--oc);}\n\n/* Bandeau récap niveau (en haut d'osignup) */\n.lvl-banner{display:flex;align-items:center;gap:12px;background:var(--co2);border:1px solid rgba(181,80,42,.25);border-radius:14px;padding:13px 15px;margin-bottom:20px;}\n.lvl-banner .lb-ic{width:38px;height:38px;border-radius:11px;background:rgba(181,80,42,.14);border:1px solid rgba(181,80,42,.26);display:flex;align-items:center;justify-content:center;color:var(--oc);flex-shrink:0;}\n.lvl-banner .lb-tx{flex:1;min-width:0;}\n.lvl-banner .lb-l{font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(245,236,215,.45);margin-bottom:3px;}\n.lvl-banner .lb-v{font-family:var(--fd);font-size:14px;color:var(--cr);}\n.lvl-banner .lb-chg{font-family:var(--fm);font-size:10px;letter-spacing:.04em;color:var(--oc);background:none;border:none;cursor:pointer;text-decoration:underline;flex-shrink:0;}\n\n/* Plafond de ventes (Niveau 1) — dashboard */\n.plafond{background:linear-gradient(160deg,rgba(217,162,60,.13),rgba(217,162,60,.03));border:1px solid rgba(217,162,60,.28);border-radius:16px;padding:16px 17px;margin-bottom:16px;}\n.plf-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}\n.plf-l{display:flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#E8B04E;}\n.plf-lvl{font-family:var(--fm);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:#E8B04E;background:rgba(217,162,60,.14);border:1px solid rgba(217,162,60,.3);padding:3px 8px;border-radius:99px;white-space:nowrap;}\n.plf-amt{display:flex;align-items:baseline;gap:6px;margin-bottom:9px;}\n.plf-amt .pa-n{font-family:var(--fd);font-size:21px;color:var(--cr);line-height:1;}\n.plf-amt .pa-max{font-family:var(--fm);font-size:12px;color:rgba(245,236,215,.45);white-space:nowrap;}\n.plf-bar{height:8px;border-radius:5px;background:rgba(245,236,215,.08);overflow:hidden;margin-bottom:10px;}\n.plf-bar > i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#D9A23C,#E8B04E);}\n.plf-note{font-size:11.5px;color:rgba(245,236,215,.5);line-height:1.5;}\n/* CTA IFU (Stratégie 4) */\n.ifu-cta{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:rgba(181,80,42,.1);border:1.5px solid rgba(181,80,42,.32);border-radius:14px;padding:14px 15px;margin-top:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;transition:background .18s;}\n.ifu-cta:active{background:rgba(181,80,42,.18);}\n.ifu-ic{width:40px;height:40px;border-radius:11px;background:rgba(181,80,42,.16);border:1px solid rgba(181,80,42,.3);display:flex;align-items:center;justify-content:center;color:var(--oc);flex-shrink:0;}\n.ifu-tx{flex:1;min-width:0;}\n.ifu-t{display:block;font-family:var(--fd);font-size:13.5px;color:var(--cr);line-height:1.15;margin-bottom:3px;}\n.ifu-s{display:block;font-size:11.5px;color:rgba(245,236,215,.55);line-height:1.4;}\n.ifu-arr{color:var(--oc);flex-shrink:0;}\n/* Pastille niveau dans le profil */\n.acct-lvl{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;}\n.acct-lvl.l1{color:#E8B04E;background:rgba(217,162,60,.13);border:1px solid rgba(217,162,60,.3);}\n.acct-lvl.l2{color:var(--oc);background:rgba(181,80,42,.14);border:1px solid rgba(181,80,42,.3);}\n\n/* OAGENTS — gestion des agents de contrôle (côté organisateur) */\n.oag-new{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:rgba(181,80,42,.1);border:1.5px dashed rgba(181,80,42,.42);border-radius:14px;padding:15px;font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--oc);cursor:pointer;-webkit-tap-highlight-color:transparent;margin-bottom:10px;}\n.oag-new:active{background:rgba(181,80,42,.18);transform:scale(.99);}\n.oag-fresh{background:linear-gradient(160deg,rgba(181,80,42,.16),rgba(181,80,42,.03));border:1px solid rgba(181,80,42,.3);border-radius:14px;padding:15px;margin-bottom:14px;animation:srPop .26s cubic-bezier(.2,.8,.3,1.2);}\n.oag-fresh-l{font-family:var(--fm);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--oc);margin-bottom:9px;display:flex;align-items:center;gap:7px;}\n.oag-fresh-code{font-family:var(--fd);font-size:25px;letter-spacing:.08em;color:var(--cr);margin-bottom:7px;}\n.oag-fresh-s{font-size:11.5px;color:rgba(245,236,215,.55);line-height:1.5;}\n.oag-card{background:var(--co2);border:1px solid rgba(245,236,215,.06);border-radius:14px;padding:14px 15px;margin-bottom:10px;}\n.oag-c-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}\n.oag-id{display:flex;align-items:center;gap:12px;min-width:0;}\n.oag-av{width:40px;height:40px;border-radius:11px;background:rgba(181,80,42,.14);border:1px solid rgba(181,80,42,.26);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:14px;color:var(--oc);flex-shrink:0;}\n.oag-name{font-family:var(--fd);font-size:14px;color:var(--cr);line-height:1.1;margin-bottom:3px;}\n.oag-zone{font-family:var(--fm);font-size:10px;letter-spacing:.04em;color:rgba(245,236,215,.45);}\n.oag-code-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(245,236,215,.06);}\n.oag-code{font-family:var(--fm);font-size:13px;letter-spacing:.1em;color:var(--cr);background:rgba(245,236,215,.05);border:1px solid rgba(245,236,215,.1);border-radius:8px;padding:7
