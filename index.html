e-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M22 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fdiv><span class=\"bn-lbl\">Équipe<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- #device -->\n\n<script>\nconst ALL=['s1','srole','s2','s3','s4','s5','s6','sforgot','s7','s8','s9','s10','s11','s12','s13','s14','s15','s16','s17','oonb','ologin','otier','osignup','odash','oevent','ocreate','osubmit','osales','opayout','oprofile','oagents','conb','cauth','csync','cscan','cstats','cteam'];\nlet prevScreen='s1';\n\nfunction nav(id){\n  prevScreen=document.querySelector('.screen.active')?.id||'s1';\n  ALL.forEach(s=>{\n    const el=document.getElementById(s);\n    if(el){el.classList.remove('active');el.scrollTop=0;}\n  });\n  const el=document.getElementById(id);\n  if(el)el.classList.add('active');\n  if(id==='s13')setTimeout(()=>{if(document.getElementById('s13').classList.contains('active'))nav('s14');},2500);\n}\n\nfunction history_back(){nav(prevScreen);}\n\n/* SPLASH */\n(function(){\n  // Deep-link (?s=sX) — utilisé par le board maquettes : affiche un écran figé\n  var deep=(location.search.match(/[?&]s=([a-z0-9]+)/i)||[])[1];\n  if(deep && document.getElementById(deep)){\n    document.documentElement.classList.add('static-shot');\n    nav(deep);\n    return;\n  }\n  const bar=document.getElementById('splashBar');\n  const DURATION=2400;\n  const start=performance.now();\n  function tick(now){\n    const p=Math.min((now-start)/DURATION*100,100);\n    bar.style.width=p+'%';\n    if(p<100)requestAnimationFrame(tick);\n    else nav('srole');\n  }\n  requestAnimationFrame(tick);\n})();\n\n/* ONBOARDING */\nlet obIdx=0;\nfunction obNext(){\n  obIdx++;\n  if(obIdx>=3){nav('s3');obIdx=0;updOb(0);return;}\n  updOb(obIdx);\n}\nfunction updOb(i){\n  document.getElementById('obTrack').style.transform=`translateX(${-i*(100/3)}%)`;\n  document.querySelectorAll('.ob-dot').forEach((d,j)=>d.classList.toggle('on',j===i));\n  document.getElementById('obBtn').textContent=i===2?'Commencer →':'Suivant';\n}\n\n/* TABS */\nfunction switchTab(btn,which){\n  document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('on'));\n  btn.classList.add('on');\n  document.getElementById('listUp').style.display=which==='up'?'block':'none';\n  document.getElementById('listPast').style.display=which==='past'?'block':'none';\n}\n\n/* TICKET TYPE */\nfunction selTt(el){document.querySelectorAll('.tt-card').forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}\n\n/* QTY */\nconst FEE=100;\nfunction fmt(n){return n.toLocaleString('fr-FR')+' XOF';}\nfunction syncOrder(){\n  const n1=parseInt(document.getElementById('q1').textContent)||0;\n  const n2=parseInt(document.getElementById('q2').textContent)||0;\n  const sub=n1*2500+n2*6000;\n  const total=sub>0?sub+FEE:0;\n  // Récap dynamique\n  const box=document.getElementById('orderBox');\n  let rows='';\n  if(n1>0)rows+=`<div class=\"order-row\"><span>${n1}× Standard<\u002Fspan><span>${fmt(n1*2500)}<\u002Fspan><\u002Fdiv>`;\n  if(n2>0)rows+=`<div class=\"order-row\"><span>${n2}× VIP<\u002Fspan><span>${fmt(n2*6000)}<\u002Fspan><\u002Fdiv>`;\n  if(!rows)rows=`<div class=\"order-row\" style=\"color:rgba(245,236,215,.35);\"><span>Aucun billet sélectionné<\u002Fspan><span>—<\u002Fspan><\u002Fdiv>`;\n  rows+=`<div class=\"order-row\"><span>Frais de service<\u002Fspan><span>${fmt(FEE)}<\u002Fspan><\u002Fdiv>`;\n  rows+=`<div class=\"order-row tot\"><span>Total<\u002Fspan><span class=\"v\" id=\"gtotal\">${fmt(total)}<\u002Fspan><\u002Fdiv>`;\n  box.innerHTML=rows;\n  // Propagation paiement + confirmation\n  const pt=document.getElementById('payTotal');if(pt)pt.textContent=fmt(total);\n  const cb=document.getElementById('confBillet');\n  if(cb){const parts=[];if(n1>0)parts.push(`${n1}× Standard`);if(n2>0)parts.push(`${n2}× VIP`);cb.textContent=parts.join(' + ')||'—';}\n  const cm=document.getElementById('confMontant');if(cm)cm.textContent=fmt(total);\n  // CTA désactivé si vide\n  const cta=document.querySelector('#s11 > .btn-p');\n  if(cta){cta.style.opacity=total>0?'1':'.4';cta.style.pointerEvents=total>0?'auto':'none';}\n}\nfunction chgQty(e,d,id){\n  e.stopPropagation();\n  const el=document.getElementById(id);\n  let v=parseInt(el.textContent)+d;\n  v=Math.max(0,Math.min(4,v));\n  el.textContent=v;\n  syncOrder();\n}\n\n/* PAY */\nfunction selPay(el){document.querySelectorAll('.pay-item').forEach(m=>m.classList.remove('sel'));el.classList.add('sel');}\n\n/* OTP */\ndocument.querySelectorAll('.otp-box').forEach((b,i,boxes)=>{\n  b.addEventListener('input',()=>{b.classList.toggle('filled',b.value.length>0);if(b.value.length===1&&i<boxes.length-1)boxes[i+1].focus();});\n  b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&i>0)boxes[i-1].focus();});\n});\n\n/* Chips accueil */\ndocument.querySelectorAll('.chip').forEach(c=>{\n  c.addEventListener('click',()=>{\n    c.closest('.chips').querySelectorAll('.chip').forEach(x=>{x.className='chip off';});\n    c.className='chip on';\n  });\n});\n\n/* AUTH — email/mot de passe (US-008/009/010) */\nfunction togglePwd(id,btn){var i=document.getElementById(id);if(!i)return;i.type=i.type==='password'?'text':'password';btn.classList.toggle('on');}\nfunction loginMethod(m){\n  document.getElementById('atEmail').classList.toggle('on',m==='email');\n  document.getElementById('atPhone').classList.toggle('on',m==='phone');\n  document.getElementById('loginEmail').hidden=(m!=='email');\n  document.getElementById('loginPhone').hidden=(m!=='phone');\n}\nfunction validateSignup(){\n  var email=(document.getElementById('suEmail').value||'').trim();\n  var pwd=document.getElementById('suPwd').value||'';\n  var err=document.getElementById('suErr');\n  function show(m){err.textContent=m;err.hidden=false;}\n  if(!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)){show('Entre une adresse email valide.');return;}\n  if(email.toLowerCase()==='kofi@wamiton.bj'){show('Cet email est déjà utilisé. Connecte-toi.');return;}\n  if(pwd.length<8){show('Le mot de passe doit comporter au moins 8 caractères.');return;}\n  err.hidden=true;\n  document.getElementById('confirmEmail').textContent=email;\n  nav('s6');\n}\nfunction openForgot(){\n  document.getElementById('forgotForm').style.display='flex';\n  document.getElementById('forgotForm').hidden=false;\n  document.getElementById('forgotDone').hidden=true;\n  nav('sforgot');\n}\nfunction sendReset(){\n  document.getElementById('forgotForm').style.display='none';\n  document.getElementById('forgotForm').hidden=true;\n  document.getElementById('forgotDone').hidden=false;\n}(function(){\n  var tc=document.getElementById('ticketCode');\n  if(!tc)return;\n  function gen(){return String(Math.floor(100000+Math.random()*900000)).replace(/(\\d{3})(\\d{3})/,'$1 $2');}\n  setInterval(function(){\n    tc.style.opacity='0';\n    setTimeout(function(){tc.textContent=gen();tc.style.opacity='1';},280);\n  },10000);\n})();\n\n/* ============================================================\n   ESPACE ORGANISATEUR — logique\n============================================================ */\nfunction pickOne(el){el.parentElement.querySelectorAll('.cat-opt').forEach(x=>x.classList.remove('on'));el.classList.add('on');}\nfunction pickCat(el){el.parentElement.querySelectorAll('.cat-opt').forEach(x=>x.classList.remove('on'));el.classList.add('on');syncRecap();}\n\nlet wzStep=1;\nfunction startCreate(){wzStep=1;setStep(1);recalc();syncDates();syncRecap();nav('ocreate');}\nfunction exitCreate(){nav('odash');}\n\n/* Détail événement — badge + contenu selon le statut */\nconst OEV={\n  vaudou:{badge:'st-pub',badgeTxt:'Publié · en vente',name:'VAUDOU NIGHTS — Édition Spéciale',meta:'<b>SAM 7 JUIN · 20H00<\u002Fb><br>Champ de Foire · Cotonou',state:'pub',sold:'342',cap:'500',rev:'1,11 M',fill:68,left:'158 places restantes'},\n  jazz:{badge:'st-wait',badgeTxt:'En attente de validation',name:'Jazz au Bénin — Orchestre National',meta:'<b>VEN 13 JUIN · 19H30<\u002Fb><br>Palais des Congrès · Cotonou',state:'wait'},\n  afro:{badge:'st-past',badgeTxt:'Passé · terminé',name:'AfroFusion — Nuit de la Musique',meta:'<b>SAM 17 MAI · 21H00<\u002Fb><br>Fondation Zinsou · Cotonou',state:'past',sold:'480',cap:'480',rev:'2,30 M',fill:100,left:'Complet'}\n};\nfunction openEvent(key){\n  const e=OEV[key];if(!e)return;\n  const $=id=>document.getElementById(id);\n  const pub=e.state==='pub',wait=e.state==='wait',past=e.state==='past';\n  $('oevBadge').className='st-badge '+e.badge;\n  $('oevBadge').textContent=e.badgeTxt;\n  $('oevName').textContent=e.name;\n  $('oevMeta').innerHTML=e.meta;\n  $('oevPending').style.display=wait?'flex':'none';\n  $('oevKpi').style.display=wait?'none':'grid';\n  if(!wait){\n    $('oevSold').textContent=e.sold;$('oevCap').textContent=e.cap;\n    $('oevRev').textContent=e.rev;$('oevFill').textContent=e.fill;\n    $('oevFillBar').style.width=e.fill+'%';$('oevLeft').textContent=e.left;\n  }\n  $('oevDatesWrap').style.display=past?'none':'block';\n  $('oevActSales').style.display=wait?'none':'flex';\n  $('oevSalesL').textContent=past?'Bilan des ventes':'Suivi des ventes';\n  $('oevSalesS').textContent=past?\"Résultats finaux de l'événement\":'KPI, graphique, répartition';\n  $('oevActEdit').style.display=past?'none':'flex';\n  $('oevActPay').style.display=wait?'none':'flex';\n  $('oevPayS').textContent=past?'Reversé le 19 Mai · MTN MoMo':\"Prévu 48h après l'événement\";\n  if(past){$('oevLock').style.display='flex';$('oevLockTxt').textContent='Événement archivé. Billets utilisés et recettes reversées.';}\n  else if(wait){$('oevLock').style.display='none';}\n  else{$('oevLock').style.display='flex';$('oevLockTxt').textContent='Les prix et catégories sont verrouillés : des billets sont déjà vendus. Tu peux toujours modifier description, horaire, lieu et photos.';}\n  nav('oevent');\n}\nwindow.openEvent=openEvent;\nfunction setStep(n){\n  wzStep=n;\n  document.querySelectorAll('#ocreate .wz-step').forEach(s=>s.classList.toggle('on',+s.dataset.step===n));\n  document.querySelectorAll('#wzSteps .wz-st').forEach(s=>{const i=+s.dataset.st;s.classList.toggle('done',i<n);s.classList.toggle('cur',i===n);});\n  document.querySelectorAll('#wzSteps .wz-line').forEach((l,idx)=>l.classList.toggle('done',idx<n-1));\n  const back=document.getElementById('wzBack');if(back)back.style.visibility=n>1?'visible':'hidden';\n  const next=document.getElementById('wzNext');if(next)next.textContent=n>=5?'Soumettre à validation':'Continuer';\n  if(n===5)syncRecap();\n  const body=document.getElementById('wzBody');if(body)body.scrollTop=0;\n}\nfunction goStep(n){setStep(n);}\nfunction nextStep(){if(wzStep>=5){nav('osubmit');return;}setStep(wzStep+1);}\nfunction prevStep(){if(wzStep>1)setStep(wzStep-1);}\n\nconst TK_TPL=`<div class=\"tk-cat\"><div class=\"tk-cat-top\"><input class=\"tk-name-in\" placeholder=\"Nom de la catégorie\" oninput=\"syncRecap()\"><button class=\"tk-del\" onclick=\"delCat(this)\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/><\u002Fsvg><\u002Fbutton><\u002Fdiv><div class=\"tk-fields\"><div><label class=\"tk-mini-l\">Prix (XOF)<\u002Flabel><input class=\"tk-mini-in tk-price\" inputmode=\"numeric\" value=\"0\" oninput=\"recalc()\"><\u002Fdiv><div><label class=\"tk-mini-l\">Places<\u002Flabel><input class=\"tk-mini-in tk-qty\" inputmode=\"numeric\" value=\"50\" oninput=\"recalc()\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\nfunction addCat(){const list=document.getElementById('tkList');if(list.children.length>=5)return;const w=document.createElement('div');w.innerHTML=TK_TPL;list.appendChild(w.firstChild);recalc();}\nfunction delCat(btn){const list=document.getElementById('tkList');if(list.children.length<=1)return;btn.closest('.tk-cat').remove();recalc();}\nfunction recalc(){\n  let cap=0;\n  document.querySelectorAll('#tkList .tk-qty').forEach(q=>cap+=parseInt(q.value)||0);\n  const capTxt=cap.toLocaleString('fr-FR')+' places';\n  const ct=document.getElementById('capTotal');if(ct)ct.textContent=capTxt;\n  const rcc=document.getElementById('rcCap');if(rcc)rcc.textContent=capTxt;\n  const first=document.querySelector('#tkList .tk-cat');\n  if(first){\n    const price=parseInt(first.querySelector('.tk-price').value)||0;\n    const nm=first.querySelector('.tk-name-in').value||'Catégorie';\n    const fee=Math.round(price*0.10),net=price-fee;\n    document.getElementById('simCat').textContent=nm;\n    document.getElementById('simPrice').textContent=price===0?'Gratuit':fmt(price);\n    document.getElementById('simFee').textContent=price===0?'− 0 XOF':'− '+fmt(fee);\n    document.getElementById('simNet').textContent=fmt(net);\n  }\n  const add=document.getElementById('tkAdd');if(add)add.classList.toggle('off',document.querySelectorAll('#tkList .tk-cat').length>=5);\n  syncRecap();\n}\nfunction syncRecap(){\n  const g=id=>document.getElementById(id);\n  if(g('rcName')&&g('cName'))g('rcName').textContent=g('cName').value||'—';\n  const catOn=document.querySelector('#ocreate .wz-step[data-step=\"1\"] .cat-pick .cat-opt.on');\n  if(g('rcCat'))g('rcCat').textContent=catOn?catOn.textContent:'—';\n  if(g('rcWhen')&&g('cDate')&&g('cTime'))g('rcWhen').textContent=g('cDate').value+' · '+g('cTime').value;\n  if(g('rcVenue')&&g('cVenue'))g('rcVenue').textContent=(g('cVenue').value||'—')+' · Cotonou';\n  const rt=g('rcTickets');\n  if(rt){let html='';document.querySelectorAll('#tkList .tk-cat').forEach(c=>{const nm=c.querySelector('.tk-name-in').value||'Catégorie';const pr=parseInt(c.querySelector('.tk-price').value)||0;const qt=parseInt(c.querySelector('.tk-qty').value)||0;html+=`<div class=\"recap-row\"><span class=\"recap-k\">${nm}<\u002Fspan><span class=\"recap-v\">${pr===0?'Gratuit':fmt(pr)} · ${qt} pl.<\u002Fspan><\u002Fdiv>`;});rt.innerHTML=html;}\n}\nfunction syncDates(){\n  const rc=document.getElementById('rClose'),re=document.getElementById('rEmit');\n  if(!rc||!re)return;\n  const close=+rc.value,emit=+re.value;\n  document.getElementById('vClose').textContent=close+' h';\n  document.getElementById('vEmit').textContent=emit+' h';\n  document.getElementById('dkClose').textContent=close+'h avant';\n  document.getElementById('dkEmit').textContent=emit+'h avant';\n  const start=new Date(2026,5,7,20,0);\n  const days=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];\n  const mon=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];\n  const f=d=>`${days[d.getDay()]} ${d.getDate()} ${mon[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}h${String(d.getMinutes()).padStart(2,'0')}`;\n  const cd=new Date(start-close*3600000),ed=new Date(start-emit*3600000);\n  document.getElementById('recClose').textContent=f(cd);\n  document.getElementById('recEmit').textContent=f(ed);\n  document.getElementById('recCede').textContent=f(ed);\n  document.getElementById('dkAlert').classList.toggle('hide',!(emit<close));\n}\n/* (format wizard uniquement) */\n\n/* ============================================================\n   SURFACE C — CONTRÔLE DES ENTRÉES (Check-in)\n============================================================ */\n/* Sélection de l'événement à contrôler */\nfunction pickCev(el){\n  document.querySelectorAll('#conb .cev-opt').forEach(o=>o.classList.remove('sel'));\n  el.classList.add('sel');\n}\n\n/* État du contrôle */\nlet cState={entered:218,cap:500,refused:3,synced:false};\n\n/* US-041 — Synchronisation de la liste hors-ligne */\nlet syncing=false;\nfunction doSync(){\n  if(syncing)return;\n  syncing=true;\n  const ring=document.getElementById('syncRing');\n  const pct=document.getElementById('syncPct');\n  const state=document.getElementById('syncState');\n  const icon=document.getElementById('syncIcon');\n  const btn=document.getElementById('syncBtn');\n  const C=565;\n  icon.style.display='none';\n  pct.style.display='block';\n  state.textContent='Téléchargement…';\n  btn.textContent='Synchronisation…';\n  btn.style.opacity='.5';btn.style.pointerEvents='none';\n  const start=performance.now(),DUR=1900;\n  function tick(now){\n    const p=Math.min((now-start)/DUR,1);\n    pct.textContent=Math.round(p*100)+'%';\n    ring.style.strokeDashoffset=C*(1-p);\n    if(p<1){requestAnimationFrame(tick);return;}\n    // terminé\n    syncing=false;cState.synced=true;\n    pct.style.display='none';\n    icon.style.display='block';\n    icon.innerHTML='<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>';\n    state.textContent='Liste à jour';\n    document.getElementById('syncLast').textContent=\"À l'instant\";\n    document.getElementById('syncLast').classList.add('ok');\n    document.getElementById('syncCount').textContent='500 billets';\n    // pastille scanner repasse au vert\n    const pill=document.getElementById('scanSyncPill');\n    pill.classList.remove('warn');\n    document.getElementById('scanSyncTxt').textContent=\"Sync. à l'instant · 500 billets\";\n    btn.textContent='Ouvrir le scanner';\n    btn.style.opacity='1';btn.style.pointerEvents='auto';\n    btn.setAttribute('onclick','nav(\"cscan\")');\n  }\n  requestAnimationFrame(tick);\n}\n\n/* US-033 — Simulation d'un scan (valide / déjà utilisé / invalide) */\nconst SCAN_FIXTURES=[\n  {name:'Adjoavi Koudjo',cat:'Standard',ref:'WMT-2026-4830'},\n  {name:'Sègbé Mensah',cat:'VIP',ref:'WMT-2026-4795'},\n  {name:'Koffi Dossou',cat:'Standard',ref:'WMT-2026-4711'},\n  {name:'Ayaba Hounkpatin',cat:'VIP',ref:'WMT-2026-4768'}\n];\nlet scanFx=0;\nfunction nowHM(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}\nfunction simScan(type){\n  const res=document.getElementById('scanResult');\n  const mark=document.getElementById('srMark');\n  const status=document.getElementById('srStatus');\n  const reason=document.getElementById('srReason');\n  const card=document.getElementById('srCard');\n  res.classList.remove('valid','refus');\n  const CHECK='<svg width=\"52\" height=\"52\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>';\n  const CROSS='<svg width=\"50\" height=\"50\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"/><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"/><\u002Fsvg>';\n  if(type==='valid'){\n    const fx=SCAN_FIXTURES[scanFx++%SCAN_FIXTURES.length];\n    res.classList.add('valid');\n    mark.innerHTML=CHECK;\n    status.textContent='Billet valide';\n    reason.textContent='Entrée autorisée';\n    card.innerHTML=\n      '<div class=\"sr-row\"><span class=\"sr-k\">Participant<\u002Fspan><span class=\"sr-v big\">'+fx.name+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Catégorie<\u002Fspan><span class=\"sr-v\">'+fx.cat+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Référence<\u002Fspan><span class=\"sr-v\" style=\"font-family:var(--fm);font-size:12px;\">'+fx.ref+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Validé à<\u002Fspan><span class=\"sr-v\">'+nowHM()+'<\u002Fspan><\u002Fdiv>';\n    // incrémente les compteurs\n    cState.entered++;\n    updateCheckinCounters();\n  } else if(type==='used'){\n    res.classList.add('refus');\n    mark.innerHTML=CROSS;\n    status.textContent='Déjà utilisé';\n    reason.textContent='Ce billet a déjà été scanné';\n    card.innerHTML=\n      '<div class=\"sr-row\"><span class=\"sr-k\">Participant<\u002Fspan><span class=\"sr-v big\">Raoul Tévoédjrè<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Catégorie<\u002Fspan><span class=\"sr-v\">Standard<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Référence<\u002Fspan><span class=\"sr-v\" style=\"font-family:var(--fm);font-size:12px;\">WMT-2026-4655<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Première entrée<\u002Fspan><span class=\"sr-v\" style=\"color:#ED7A70;\">20:01 · Entrée principale<\u002Fspan><\u002Fdiv>';\n    cState.refused++;\n  } else {\n    res.classList.add('refus');\n    mark.innerHTML=CROSS;\n    status.textContent='Billet invalide';\n    reason.textContent='QR non reconnu pour cet événement';\n    card.innerHTML=\n      '<div class=\"sr-row\"><span class=\"sr-k\">Référence<\u002Fspan><span class=\"sr-v\" style=\"font-family:var(--fm);font-size:12px;\">— inconnue —<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Statut<\u002Fspan><span class=\"sr-v\" style=\"color:#ED7A70;\">Hors liste synchronisée<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"sr-row\"><span class=\"sr-k\">Scanné à<\u002Fspan><span class=\"sr-v\">'+nowHM()+'<\u002Fspan><\u002Fdiv>';\n    cState.refused++;\n  }\n  res.classList.add('show');\n  if(navigator.vibrate)navigator.vibrate(type==='valid'?40:[60,40,60]);\n}\nfunction closeScanResult(){\n  document.getElementById('scanResult').classList.remove('show');\n}\nfunction updateCheckinCounters(){\n  const e=cState.entered,cap=cState.cap;\n  const pct=Math.round(e/cap*100);\n  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v;};\n  set('scanCount',e);\n  set('teamEntered',e+' / '+cap);\n  set('cstTotal',e);set('cstIn',e);set('cstFill',pct);\n  const fb=document.getElementById('cstFillBar');if(fb)fb.style.width=pct+'%';\n  const tt=document.getElementById('teamEntered');if(tt)tt.innerHTML=e+'<span class=\"u\"> / '+cap+'<\u002Fspan>';\n}\n\n/* US-034 — Inviter un agent temporaire */\n/* US-034 — Gestion des agents (côté organisateur) */\nfunction createAgentAccess(){\n  const code='GANGBE-'+Math.floor(1000+Math.random()*9000);\n  const fresh=document.getElementById('oagFresh');\n  document.getElementById('oagFreshCode').textContent=code;\n  fresh.hidden=false;\n  // nouvelle carte agent (en attente de connexion)\n  const list=document.getElementById('oagList');\n  const card=document.createElement('div');\n  card.className='oag-card';\n  const ic='<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\" rx=\"2\"/><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"/><\u002Fsvg>';\n  const tr='<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"3 6 5 6 21 6\"/><path d=\"M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2\"/><\u002Fsvg>';\n  card.innerHTML=\n    '<div class=\"oag-c-top\"><div class=\"oag-id\"><div class=\"oag-av\" style=\"background:rgba(245,236,215,.06);border-color:rgba(245,236,215,.12);color:rgba(245,236,215,.4);\">?<\u002Fdiv>'+\n    '<div><div class=\"oag-name\" style=\"color:rgba(245,236,215,.7);\">Nouvel agent<\u002Fdiv><div class=\"oag-zone\">Code à partager<\u002Fdiv><\u002Fdiv><\u002Fdiv>'+\n    '<span class=\"st-badge st-wait\">En attente<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"oag-code-row\"><span class=\"oag-code\">'+code+'<\u002Fspan><div class=\"oag-act\">'+\n    '<button onclick=\"copyCode(\\''+code+'\\',this)\" title=\"Copier\">'+ic+'<\u002Fbutton>'+\n    '<button class=\"rev\" onclick=\"revokeAgent(this)\" title=\"Révoquer\">'+tr+'<\u002Fbutton><\u002Fdiv><\u002Fdiv>';\n  list.insertBefore(card,list.firstChild);\n  const c=document.getElementById('oagCount'); c.textContent=(parseInt(c.textContent)||0)+1;\n  const sc=document.querySelector('#oagents .o-scroll'); if(sc)sc.scrollTop=0;\n}\nfunction copyCode(code,btn){\n  if(navigator.clipboard)navigator.clipboard.writeText(code).catch(()=>{});\n  const old=btn.innerHTML;\n  btn.innerHTML='<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"/><\u002Fsvg>';\n  btn.style.color='var(--oc)';btn.style.borderColor='var(--oc)';\n  setTimeout(()=>{btn.innerHTML=old;btn.style.color='';btn.style.borderColor='';},1200);\n}\nfunction revokeAgent(btn){\n  if(!confirm(\"Révoquer cet accès agent ?\\n\\nLe code ne fonctionnera plus pour scanner. Cette action est immédiate.\")) return;\n  const card=btn.closest('.oag-card');\n  card.classList.add('revoked');\n  setTimeout(()=>{\n    card.remove();\n    const c=document.getElementById('oagCount'); c.textContent=Math.max(0,(parseInt(c.textContent)||1)-1);\n  },180);\n}\n\n/* Mode d'authentification check-in (agent / organisateur) */\nfunction cAuthMode(m){\n  document.getElementById('atAgent').classList.toggle('on',m==='agent');\n  document.getElementById('atOrga').classList.toggle('on',m==='orga');\n  document.getElementById('cAuthAgent').hidden=(m!=='agent');\n  document.getElementById('cAuthOrga').hidden=(m!=='orga');\n}\n\n/* Déconnexion d'un agent de contrôle (accès temporaire) */\nfunction logoutAgent(){\n  if(confirm(\"Se déconnecter du contrôle ?\\n\\nTes scans déjà synchronisés sont conservés. Tu devras ressaisir le code agent pour reprendre.\")){\n    cAuthMode('agent');\n    nav('srole');\n  }\n}\n\n/* ============================================================\n   ESPACE ORGA — AUTH & SYSTÈME DE TIERS (Niveau 1 / Niveau 2)\n============================================================ */\nlet orgTier=2; // 2 = Pro (compte existant par défaut) · 1 = Basique informel\nconst ICON_CIP='<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"9\" cy=\"10\" r=\"2\"/><path d=\"M7 16h10\"/><\u002Fsvg>';\nconst ICON_DOC='<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"/><polyline points=\"14 2 14 8 20 8\"/><\u002Fsvg>';\n\nfunction loginMethodO(m){\n  document.getElementById('atOEmail').classList.toggle('on',m==='email');\n  document.getElementById('atOPhone').classList.toggle('on',m==='phone');\n  document.getElementById('ologinEmail').hidden=(m!=='email');\n  document.getElementById('ologinPhone').hidden=(m!=='phone');\n}\nfunction loginOrg(){ orgTier=2; applyOrgTier(); nav('odash'); }\n\nfunction chooseTier(n){\n  orgTier=n;\n  const t1=document.getElementById('osDocsT1'), t2=document.getElementById('osDocsT2');\n  const nm=document.getElementById('osLvlName'), ic=document.getElementById('osLvlIc');\n  if(n===1){\n    t1.hidden=false; t2.hidden=true;\n    nm.textContent='Niveau 1 · Compte Basique';\n    ic.innerHTML=ICON_CIP;\n  } else {\n    t1.hidden=true; t2.hidden=false;\n    nm.textContent='Niveau 2 · Compte Pro';\n    ic.innerHTML=ICON_DOC;\n  }\n  nav('osignup');\n}\nfunction finishSignup(){ applyOrgTier(); nav('odash'); }\n\nfunction applyOrgTier(){\n  const plf=document.getElementById('odashPlafond');\n  if(plf) plf.style.display = (orgTier===1) ? 'block' : 'none';\n  const lvl=document.getElementById('oprofLevel');\n  if(lvl) lvl.textContent = (orgTier===1) ? 'Niveau 1 · Compte Basique' : 'Niveau 2 · Compte Pro';\n  const ifu=document.getElementById('oprofIfu');\n  if(ifu) ifu.style.display = (orgTier===1) ? 'flex' : 'none';\n}\napplyOrgTier();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
